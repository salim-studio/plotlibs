<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="plotlibs banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.55" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" rx="0" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
  </g>
  <!-- logo mark -->
  <g transform="translate(88,104)">
    <rect width="120" height="120" rx="28" fill="url(#lg)"/>
    <polyline points="24,88 44,62 62,68 82,38 100,28" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="82" cy="38" r="6" fill="#A3E635"/>
    <circle cx="100" cy="28" r="6" fill="#FFFFFF"/>
  </g>
  <!-- wordmark -->
  <text x="232" y="180" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-2">plotlibs</text>
  <text x="234" y="222" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#CBD5E1">Fast, beautiful Python plotting for everyone.</text>
  <!-- pills -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">
    <rect x="234" y="252" width="150" height="44" rx="22" fill="#4F46E5"/>
    <text x="258" y="281" fill="#FFFFFF">4x faster</text>
    <rect x="396" y="252" width="230" height="44" rx="22" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <text x="418" y="281" fill="#E0F2FE">matplotlib-compatible</text>
    <rect x="638" y="252" width="200" height="44" rx="22" fill="none" stroke="#A3E635" stroke-width="2"/>
    <text x="660" y="281" fill="#ECFCCB">SQL • EDA • ML/DL</text>
  </g>
  <!-- mini chart right -->
  <g transform="translate(940,90)">
    <rect width="252" height="220" rx="20" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <polyline points="28,170 70,120 110,132 150,80 190,60 224,40" fill="none" stroke="#22D3EE" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="28,180 70,150 110,155 150,120 190,110 224,96" fill="none" stroke="#A3E635" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <circle cx="190" cy="60" r="8" fill="#FFFFFF"/>
  </g>
</svg>
